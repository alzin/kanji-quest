name: Backend checks

on:
  push:
    paths: ['backend/**', 'src/data/regions.ts', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'src/data/regions.ts', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kanji
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: kanji_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kanji -d kanji_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run backend:build
      - run: npm run backend:test
        env:
          TEST_DATABASE_URL: postgresql://kanji:test-only-password@localhost:5432/kanji_test
