name: Deploy production

# Production is promoted deliberately: fast-forward the `production` branch to a
# commit on `main` that already passed CI and shipped to the Pages test site.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kanji
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: kanji_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kanji -d kanji_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm ci --prefix backend
      - run: npm run backend:build
      - run: npm run backend:test
        env:
          TEST_DATABASE_URL: postgresql://kanji:test-only-password@localhost:5432/kanji_test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Approval gate and production-only variables live on this environment.
    environment:
      name: production
      url: https://kanji.nipporia.com
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SHA: ${{ github.sha }}
      # Naming the staging bucket avoids storage.buckets.list, a project-level
      # permission the deploy account deliberately does not hold.
      STAGING: gs://${{ vars.GCP_PROJECT_ID }}_cloudbuild/source
    steps:
      - uses: actions/checkout@v6

      # Keyless auth via Workload Identity Federation: no service account JSON
      # key is ever stored in GitHub.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      # Images are built by Cloud Build, not `docker build` on the runner. The
      # web image runs Nitro's prerenderer during `npm run build`, which fails on
      # a GitHub-hosted runner with an immediate ECONNREFUSED 127.0.0.1:3000
      # while succeeding in Cloud Build and locally. Building where it is known
      # to work also keeps image pushes inside GCP.
      # --suppress-logs: streaming build logs requires project Viewer, which the
      # deploy account does not have. The build result is still awaited.
      - name: Build API image
        run: |
          gcloud builds submit backend --project "$PROJECT" \
            --config cloudbuild.api.yaml \
            --substitutions=_TAG="$SHA" \
            --gcs-source-staging-dir "$STAGING" --suppress-logs

      - name: Build web image
        run: |
          gcloud builds submit --project "$PROJECT" --config cloudbuild.web.yaml \
            --substitutions=_API_URL="${{ vars.PROD_API_URL }}",_TAG="$SHA" \
            --gcs-source-staging-dir "$STAGING" --suppress-logs

      # Runtime config (secrets, env vars, service account) is set once on the
      # service; deploys only swap the image so nothing here can leak it.
      - name: Deploy API
        run: |
          gcloud run deploy "${{ vars.API_SERVICE }}" --image "$IMAGE_BASE/api:$SHA" \
            --project "$PROJECT" --region "$REGION" --quiet

      # Pages also ships the new curriculum from main. Keep its separate test
      # backend compatible with those saves, retaining its own database,
      # OAuth settings and secret references.
      - name: Deploy Pages test API
        run: |
          gcloud run deploy kanji-quest-api --image "$IMAGE_BASE/api:$SHA" \
            --project "$PROJECT" --region "$REGION" --quiet

      - name: Deploy web
        run: |
          gcloud run deploy "${{ vars.WEB_SERVICE }}" --image "$IMAGE_BASE/web:$SHA" \
            --project "$PROJECT" --region "$REGION" --quiet

      # Checks the Cloud Run service URLs, so this passes even before a custom
      # domain's certificate has been issued.
      - name: Smoke check
        run: |
          api=$(gcloud run services describe "${{ vars.API_SERVICE }}" \
            --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          web=$(gcloud run services describe "${{ vars.WEB_SERVICE }}" \
            --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 "$api/api/health"
          curl -fsS --retry 5 --retry-delay 5 "$api/api/ready"
          test_api=$(gcloud run services describe kanji-quest-api \
            --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 "$test_api/api/ready"
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null "$web/"
